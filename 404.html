<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>4PHILLY</title>
<script>
(function(){
  var path = window.location.pathname || "/";
  var repo = "4philly";
  var segments = path.split("/");

  if (segments.length > 1 && segments[1] && segments[1].toLowerCase() === repo) {
    window.location.replace("/" + repo + "/" + window.location.search + window.location.hash);
    return;
  }

  // Fallback for custom-domain/root deployments.
  window.location.replace("./" + window.location.search + window.location.hash);
})();
</script>
</head>
<body></body>
</html>
