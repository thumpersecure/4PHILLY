<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  Source for /og-image.png — the 1200x630 social card.

  Render (Chromium, exact viewport, no scaling):

    chrome --headless --disable-gpu --hide-scrollbars \
           --force-device-scale-factor=1 --virtual-time-budget=4000 \
           --window-size=1200,630 --screenshot=og-image.png \
           file://$PWD/tools/og-card.html

  Chromium's newer headless mode subtracts browser chrome from --window-size,
  which crops the card; use the old headless (or headless_shell) so the
  viewport is exactly 1200x630. Bump the version pill and the ?v= query on
  every og:image / twitter:image tag whenever this is re-rendered.

  Same tokens as the site's light theme: white ground, near-black ink, one
  blue. The sample record is styled exactly as the app styles it — nothing
  here should make a record look more verified than the app shows it.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --panel:#f6f7f9; --line:#d8dde4;
    --ink:#14171a; --ink-dim:#474e57; --ink-mute:#5d6570;
    --accent:#1550e0; --on-accent:#ffffff;
    --attn:#8a5a00; --red:#c62f28; --green:#1a7f37;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px}
  body{
    background:var(--bg);
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    color:var(--ink);
  }
  /* Fixed geometry rather than insets: the render must be exactly 1200x630
     whatever viewport the headless shell decides to hand us. */
  .card{width:1200px;height:630px;padding:56px 64px 52px;display:flex;flex-direction:column;justify-content:space-between}

  .row-top{display:flex;align-items:center;justify-content:space-between}
  .eyebrow{
    font-size:15px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
    color:var(--ink-mute);
  }
  .ver{
    font-size:15px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
    color:var(--accent);
  }

  .body{display:flex;gap:52px;align-items:flex-start}
  .left{flex:1 1 auto;min-width:0}
  .mark{font-family:"Archivo",sans-serif;font-weight:800;font-size:92px;line-height:1;letter-spacing:-.03em;color:var(--ink)}
  .mark b{color:var(--accent)}
  .head{
    font-family:"Archivo",sans-serif;font-weight:800;font-size:38px;line-height:1.22;
    letter-spacing:-.015em;color:var(--ink);margin-top:26px;max-width:600px;text-wrap:balance;
  }
  .head em{font-style:normal;color:var(--accent)}

  /* The record, styled the way the app styles it: a plain panel. */
  .rec-panel{flex:0 0 366px;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:20px 22px 22px;margin-top:8px}
  .rec-cap{
    font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-mute);margin-bottom:14px;
  }
  .rec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .rec:last-child{border-bottom:0;padding-bottom:0}
  .rec .k{font-size:13.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim)}
  .rec .v{font-size:17px;font-weight:600;color:var(--ink)}
  .rec .v.bad{color:var(--red)}
  .rec .v.warn{color:var(--attn)}
  .rec .v.ok{color:var(--green)}

  .row-bot{display:flex;align-items:center;justify-content:space-between;font-size:16px}
  .tags{color:var(--ink-dim);letter-spacing:.08em}
  .tags i{font-style:normal;color:var(--ink-mute);padding:0 9px}
  .site{font-weight:600;letter-spacing:.02em;color:var(--ink-mute)}
  .site b{color:var(--accent)}
</style>
</head>
<body>
<div class="card">

  <div class="row-top">
    <div class="eyebrow">Philadelphia &middot; Free &middot; No signup</div>
    <div class="ver">v4.1</div>
  </div>

  <div class="body">
    <div class="left">
      <div class="mark"><b>4</b>PHILLY</div>
      <div class="head">Check before you rent &mdash; see what the city's own map <em>won't show you.</em></div>
    </div>

    <div class="rec-panel">
      <div class="rec-cap">Public record</div>
      <div class="rec"><span class="k">Open violations</span><span class="v bad">4</span></div>
      <div class="rec"><span class="k">Rental license</span><span class="v warn">Expired</span></div>
      <div class="rec"><span class="k">311 complaints</span><span class="v">7</span></div>
      <div class="rec"><span class="k">License gap</span><span class="v ok">Clear</span></div>
    </div>
  </div>

  <div class="row-bot">
    <div class="tags">Violations<i>&middot;</i>Licenses<i>&middot;</i>311s<i>&middot;</i>Gap Scanner</div>
    <div class="site"><b>4philly</b>.net</div>
  </div>

</div>
</body>
</html>
